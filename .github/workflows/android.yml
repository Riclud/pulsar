name: Android

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  qt:
    name: Qt ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          modules: qtshadertools
          cache: true

      - name: Install Qt for Android
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then host=mac; else host=linux; fi
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt "$host" android 6.9.3 android_arm64_v8a \
            --outputdir "$RUNNER_TEMP/android-qt"

      - name: Package the Android Qt bundle
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          PULSAR_QT_HOST="$QT_ROOT_DIR" \
          PULSAR_ANDROID_QT="$RUNNER_TEMP/android-qt/6.9.3/android_arm64_v8a" \
          bun scripts/package-android-qt.ts

      - uses: actions/upload-artifact@v4
        with:
          name: android-qt-${{ matrix.platform }}
          path: dist/pulsar-android-qt-*.tar.gz
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pulsar-android-qt-*.tar.gz

  apk:
    name: Build an APK
    needs: qt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK 27.2
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - uses: actions/download-artifact@v4
        with:
          name: android-qt-linux-x64
          path: ${{ runner.temp }}/android-qt

      - name: Unpack Qt
        shell: bash
        run: |
          mkdir -p "$HOME/.pulsar/android/qt"
          tar -xzf "$RUNNER_TEMP"/android-qt/pulsar-android-qt-*.tar.gz -C "$HOME/.pulsar/android/qt"

      - name: Build the example APK
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          export PULSAR_ANDROID_QT="$HOME/.pulsar/android/qt/6.9.3/android_arm64_v8a"
          cd tests/apps/android-app
          bun ../../../cli/index.ts build --target android

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: tests/apps/android-app/dist/*.apk
          if-no-files-found: error
