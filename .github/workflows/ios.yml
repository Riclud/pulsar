name: iOS (experimental)

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "edge/**"
      - "LICENSE"
      - ".github/workflows/docs.yml"
      - ".github/workflows/install.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/release.yml"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          host: mac
          target: ios
          modules: qtwebsockets
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Build the test app
        working-directory: tests/apps/ios-app
        env:
          PULSAR_IOS_QT: ${{ env.QT_ROOT_DIR }}
        run: bun ../../../cli/index.ts build --target ios

      - name: Start it in the simulator
        working-directory: tests/apps/ios-app
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          ios = sorted(k for k in runtimes if 'iOS' in k and runtimes[k])
          print(next(d['udid'] for d in runtimes[ios[-1]] if 'iPhone' in d['name']))")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device"
          xcrun simctl install "$device" dist/ios-app.app
          SIMCTL_CHILD_QSG_INFO=1 SIMCTL_CHILD_QT_LOGGING_RULES="qt.scenegraph.general=true;qt.rhi.general=true;qt.qpa.window=true" \
            xcrun simctl launch --stdout="$PWD/app.log" --stderr="$PWD/app.log" "$device" com.pulsar.iosapp
          sleep 60
          xcrun simctl io "$device" screenshot simulator.png
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/pulsar-ios* crashes/ 2>/dev/null || true
          cat app.log || true
          xcrun simctl spawn "$device" launchctl list | grep com.pulsar.iosapp | grep -E '^[0-9]+'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            tests/apps/ios-app/simulator.png
            tests/apps/ios-app/app.log
            tests/apps/ios-app/crashes
            tests/apps/ios-app/dist/ios-app.app/Info.plist
          if-no-files-found: warn
