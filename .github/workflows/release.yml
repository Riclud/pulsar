name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Build host, bridge and launcher
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build

      - name: Package release assets
        run: bun scripts/package-release.ts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
