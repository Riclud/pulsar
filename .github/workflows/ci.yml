name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "edge/**"
      - "LICENSE"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "edge/**"
      - "LICENSE"
      - ".github/workflows/docs.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
          - os: windows-11-arm
            cmake_arch: "-A ARM64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          modules: qtwebsockets qtmultimedia qtshadertools
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build host, bridge and launcher
        shell: bash
        run: |
          set +e
          cmake --build build --config Release 2>&1 | tee build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -iE "error|undefined|symbol|no such file|cannot|failed|ld: |framework not found" build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Version check
        run: bun run version:check

      - name: Package release assets
        shell: bash
        run: |
          set +e
          bun scripts/package-release.ts 2>&1 | tee package.log
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -iE "error|cannot|failed|not found|missing" package.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Keep the Linux x64 assets for pre-release checks
        if: runner.os == 'Linux' && runner.arch == 'X64'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: dist/*
          retention-days: 3

      - name: Smoke test (Linux x64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: bun run test
