name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build pkg-config

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          cache: true

      - uses: oven-sh/setup-bun@v2

      - name: Install JS deps
        run: bun install

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build host, bridge and launcher
        shell: bash
        run: |
          set +e
          cmake --build build --config Release 2>&1 | tee build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -iE "error|undefined|symbol|no such file|cannot|failed|ld: |framework not found" build.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Version check
        run: bun run version:check

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: bun run test
